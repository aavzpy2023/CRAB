[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rna_mining-backend"
version = "0.1.0"
description = "Backend de Python configurado dinámicamente"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.2",
    "biopython>=1.83",
    "numpy>=1.26.4",
    "pandas>=2.2.1",
    "xgboost>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "faker>=33.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-requests>=2.31.0",
    "types-passlib>=1.7.7",
    "pytest-archon>=0.0.6",
    "httpx2",
]
